<style>
:root{--blue:#262251;--orange:#E67700;--ink:#13263B;--muted:#44566B;--line:#D3DDE8}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#F5F5FA;color:var(--ink);font:16px/1.5 "Source Sans 3","Segoe UI",Helvetica,Arial,sans-serif;padding:16px}
.card{background:#fff;border:1px solid var(--line);border-top:4px solid var(--orange);border-radius:12px;box-shadow:0 10px 30px rgba(38,34,81,.12);padding:28px;max-width:380px;width:100%;display:flex;flex-direction:column;gap:14px}

p{margin:0;color:var(--muted);font-size:14.5px}
input[type=password]{font:inherit;font-size:26px;letter-spacing:.5em;text-align:center;padding:10px;border:1px solid var(--line);border-radius:8px;width:100%}
input[type=password]:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px #ECEBF6}
button{font:inherit;font-weight:700;background:var(--orange);color:#fff;border:0;border-radius:8px;padding:11px;cursor:pointer}
button:disabled{opacity:.6;cursor:wait}
label{font-size:14px;color:var(--muted);display:flex;gap:8px;align-items:center}
.err{color:#B3261E;font-weight:600;font-size:14px;min-height:1.2em}
</style>

<script>
let P=null;
const d=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function open_(code){
  if(!P){
    try{ if(location.protocol.indexOf("http")===0){ const r=await fetch("inhalt.json",{cache:"no-store"}); if(r.ok) P=await r.json(); } }catch(e){}
    if(!P) P=JSON.parse(document.getElementById("fc-data").textContent);
  }
  const base=await crypto.subtle.importKey("raw",new TextEncoder().encode(code),"PBKDF2",false,["deriveKey"]);
  const key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:d(P.s),iterations:P.n,hash:"SHA-256"},base,{name:"AES-GCM",length:256},false,["decrypt"]);
  const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:d(P.i)},key,d(P.c));
  return new TextDecoder().decode(pt);
}
async function tryCode(code,remember){
  const html=await open_(code);
  if(remember){try{localStorage.setItem("fc.berater.code",code);}catch(e){}}
  document.open();document.write(html);document.close();
}
document.getElementById("f").addEventListener("submit",async e=>{
  e.preventDefault();const b=document.getElementById("go"),err=document.getElementById("err");
  b.disabled=true;b.textContent="Wird geöffnet …";err.textContent="";
  try{await tryCode(document.getElementById("code").value.trim(),document.getElementById("merk").checked);}
  catch(x){
    err.textContent = !(window.crypto&&crypto.subtle) ? "Entschlüsselung hier nicht möglich: Seite bitte über https:// aufrufen."
      : (x&&x.name==="OperationError") ? "Code falsch – bitte erneut versuchen."
      : "Fehler beim Öffnen ("+((x&&x.message)||x)+").";
    b.disabled=false;b.textContent="Öffnen";}
});
try{const c=localStorage.getItem("fc.berater.code");if(c) tryCode(c,false).catch(()=>{try{localStorage.removeItem("fc.berater.code");}catch(e){}});}catch(e){}
</script>
